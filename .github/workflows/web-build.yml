name: Web Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The fast suites (about 4 minutes) gate every pull request and every
  # deploy. The full suite (about 20 minutes) stays a local run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PROJECT_STATE.md is a snapshot a new session reads in one go (X2).
      - name: Check PROJECT_STATE.md size
        run: |
          test "$(wc -c < PROJECT_STATE.md)" -lt 10240 || { echo "PROJECT_STATE.md is over 10 KB: move history to CHANGELOG_DEV.md"; exit 1; }

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Run fast test suites
        run: tests/run_tests.sh snapshot resource_placement world_changes game_clock structures shores navigation world_session

  export-web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Export Web build
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          export_debug: false
          presets_to_export: Web
          cache: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # godot-export copies the preset's build dir (named after the
          # preset, "Web") into build/web, so index.html ends up nested one
          # level deeper than you'd expect: build/web/Web/index.html.
          path: build/web/Web

  deploy:
    needs: export-web
    # Here, not workflow-wide: a pull request run joining the group would
    # cancel a deploy waiting in it.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
