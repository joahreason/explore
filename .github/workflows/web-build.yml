name: Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Export Web build
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          export_debug: false
          presets_to_export: Web
          cache: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # godot-export copies the preset's build dir (named after the
          # preset, "Web") into build/web, so index.html ends up nested one
          # level deeper than you'd expect: build/web/Web/index.html.
          path: build/web/Web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
